<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackson and Emily's Word Blasters</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-color: #1f2937;
            --border-color: #d1d5db;
            --success: #10b981;
            --error: #ef4444;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('Heartbeats and Homework Wallpaper Transparent_20261113_182651_0000.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Landscape Orientation Lock Overlay */
        #orientation-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(31, 41, 55, 0.95);
            color: white;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #orientation-warning svg {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (max-height: 500px) and (orientation: portrait), 
               screen and (max-width: 767px) and (orientation: portrait) {
            #orientation-warning {
                display: flex;
            }
        }

        /* Main Game Wrapper Card */
        .game-container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 90vw;
            max-width: 780px;
            height: 85vh;
            max-height: 500px;
            padding: 20px 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Transparent container style specifically for the Welcome and Companion screens */
        .game-container.welcome-mode,
        .game-container.companion-mode {
            background-color: transparent !important;
            box-shadow: none !important;
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Welcome Splash Screen (Untouched) */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            gap: 15px;
        }

        .hero-banner {
            width: 100%;
            max-width: 850px;
            height: auto;
            max-height: 72vh;
            object-fit: contain;
            border: none;
            box-shadow: none;
            background: transparent;
        }

        .enter-btn {
            background-color: #ffffff;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 12px 55px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .enter-btn:hover {
            background-color: #f3f4f6;
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        /* Companion Selection Screen (Upsized significantly) */
        #setup-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: 15px;
            box-sizing: border-box;
        }

        .setup-title {
            font-size: 2.3rem;
            font-weight: 900;
            color: #111827;
            letter-spacing: 1.5px;
            margin: 0;
            text-align: center;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.9);
        }

        .companion-choices {
            display: flex;
            gap: 100px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .companion-card {
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            padding: 0;
        }

        .companion-card:hover {
            transform: translateY(-6px);
        }

        .companion-card img {
            width: 310px;
            height: 350px;
            object-fit: contain;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.2));
            transition: transform 0.25s ease;
        }

        .companion-card:hover img {
            transform: scale(1.04);
        }

        .companion-name {
            font-size: 1.6rem;
            font-weight: 900;
            color: #111827;
            letter-spacing: 1.5px;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9);
        }

        /* Main Game Screen */
        #game-screen {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .game-stats {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #4b5563;
            font-size: 0.95rem;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 8px;
        }

        .arena-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-grow: 1;
            margin: 10px 0;
        }

        .companion-box {
            width: 130px;
            text-align: center;
        }

        .companion-box img {
            width: 95px;
            height: 95px;
            object-fit: contain;
        }

        .companion-speech {
            font-size: 0.75rem;
            color: #4b5563;
            background: #f3f4f6;
            padding: 6px 8px;
            border-radius: 6px;
            margin-top: 5px;
            min-height: 28px;
        }

        .ladder-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            padding: 0 15px;
        }

        .word-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .letter-input {
            width: 40px;
            height: 40px;
            border: 2px solid var(--primary);
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            outline: none;
            background: #fff;
        }

        .letter-input:focus {
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .action-row {
            display: flex;
            gap: 10px;
        }

        .submit-btn {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #059669;
        }

        .message-box {
            font-weight: 500;
            font-size: 0.85rem;
            min-height: 20px;
            text-align: center;
        }

        .error-text { color: var(--error); }
        .success-text { color: var(--success); }
    </style>
</head>
<body>

    <!-- Landscape Warning Overlay -->
    <div id="orientation-warning">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
        </svg>
        <h2>Please Rotate Your Device</h2>
        <p>Jackson and Emily's Word Blasters is optimized for landscape mode for the best gaming experience!</p>
    </div>

    <!-- Container starts with welcome-mode -->
    <div class="game-container welcome-mode" id="main-container">
        <!-- STEP 1: WELCOME SCREEN (UNTOUCHED) -->
        <div id="welcome-screen">
            <img src="wordblasters-welcome_20261113_193006_0000.svg" alt="Jackson and Emily Welcome" class="hero-banner">
            <button class="enter-btn" onclick="goToSetup()">ENTER</button>
        </div>

        <!-- STEP 2: COMPANION SELECTION SCREEN (UPSIZED) -->
        <div id="setup-screen">
            <h2 class="setup-title">CHOOSE YOUR COMPANION</h2>
            <div class="companion-choices">
                <button class="companion-card" onclick="selectCompanion('jackson')">
                    <img src="3336-removebg-preview.png" alt="Jackson">
                    <div class="companion-name">JACKSON</div>
                </button>
                <button class="companion-card" onclick="selectCompanion('emily')">
                    <img src="3349-removebg-preview.png" alt="Emily">
                    <div class="companion-name">EMILY</div>
                </button>
            </div>
        </div>

        <!-- STEP 3: MAIN GAME INTERFACE -->
        <div id="game-screen">
            <div class="game-stats">
                <span id="stat-level">LEVEL: 1</span>
                <span id="stat-score">SCORE: 0</span>
                <span id="stat-lives">LIVES: ❤️❤️❤️</span>
            </div>

            <div class="arena-layout">
                <!-- Companion Visual Reaction Box -->
                <div class="companion-box">
                    <img id="companion-img" src="" alt="Companion">
                    <div id="companion-speech" class="companion-speech">Let's build this bridge!</div>
                </div>

                <!-- Word Ladder Play Area -->
                <div class="ladder-area">
                    <div style="font-size: 0.9rem; font-weight: bold; color: #374151;">Start: <span id="start-word-label" style="color:var(--primary);">COLD</span></div>
                    
                    <div class="word-row" id="active-row">
                        <!-- Dynamic letter inputs generated via JS -->
                    </div>

                    <div style="font-size: 0.9rem; font-weight: bold; color: #374151;">Target: <span id="target-word-label" style="color:var(--primary);">WARM</span></div>
                    
                    <div class="action-row">
                        <button class="submit-btn" onclick="checkStep()">Submit Step</button>
                    </div>
                </div>
            </div>

            <div id="game-message" class="message-box"></div>
        </div>
    </div>

    <script>
        const assets = {
            jackson: {
                idle: "3336-removebg-preview.png",
                happy: "3384.png",
                angry: "3386.png"
            },
            emily: {
                idle: "3349-removebg-preview.png",
                happy: "3378.png",
                sad: "3377.png"
            }
        };

        let gameState = {
            companion: 'jackson',
            score: 0,
            lives: 3,
            level: 1,
            currentStepWord: "CORD",
            targetWord: "WARM"
        };

        function goToSetup() {
            const container = document.getElementById('main-container');
            container.classList.remove('welcome-mode');
            container.classList.add('companion-mode');
            
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
        }

        function selectCompanion(choice) {
            const container = document.getElementById('main-container');
            container.classList.remove('companion-mode');
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            gameState.companion = choice;
            updateCompanionExpression('idle', choice === 'jackson' ? "Let's crack this word ladder!" : "Take your time, we've got this!");
            renderPuzzle();
        }

        function updateCompanionExpression(mood, dialogue) {
            const imgEl = document.getElementById('companion-img');
            const speechEl = document.getElementById('companion-speech');
            
            const comp = gameState.companion;
            if (mood === 'happy') {
                imgEl.src = assets[comp].happy;
            } else if (mood === 'error') {
                imgEl.src = comp === 'jackson' ? assets.jackson.angry : assets.emily.sad;
            } else {
                imgEl.src = assets[comp].idle;
            }

            speechEl.textContent = dialogue;
        }

        function renderPuzzle() {
            const row = document.getElementById('active-row');
            row.innerHTML = '';
            
            for (let i = 0; i < 4; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 1;
                input.className = 'letter-input';
                input.id = `letter-${i}`;
                row.appendChild(input);
            }
        }

        function checkStep() {
            let typedWord = "";
            for (let i = 0; i < 4; i++) {
                const val = document.getElementById(`letter-${i}`).value.toUpperCase();
                typedWord += val;
            }

            const msgBox = document.getElementById('game-message');

            if (typedWord.length < 4) {
                msgBox.className = "message-box error-text";
                msgBox.textContent = "Please fill in all 4 letters!";
                return;
            }

            if (typedWord === gameState.currentStepWord) {
                gameState.score += 10;
                document.getElementById('stat-score').textContent = `SCORE: ${gameState.score}`;
                msgBox.className = "message-box success-text";
                msgBox.textContent = "Wonderful! You bridged a step!";
                
                updateCompanionExpression('happy', gameState.companion === 'jackson' ? "Boom! Nailed it!" : "Brilliant work, wonderful step!");
            } else {
                gameState.lives--;
                let hearts = "❤️".repeat(Math.max(0, gameState.lives));
                document.getElementById('stat-lives').textContent = `LIVES: ${hearts}`;
                
                msgBox.className = "message-box error-text";
                msgBox.textContent = `Incorrect! Remember: change only one letter. (Hint: Try CORD)`;
                
                updateCompanionExpression('error', gameState.companion === 'jackson' ? "Argh, watch the letters!" : "Oh no... let's try that again.");

                if (gameState.lives <= 0) {
                    alert("Game Over! Great effort, Dia!");
                    location.reload();
                }
            }
        }
    </script>
</body>
</html>
